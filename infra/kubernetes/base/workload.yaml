apiVersion: apps/v1
kind: Deployment
metadata:
  name: coolcert
  labels:
    app.kubernetes.io/name: coolcert
    app.kubernetes.io/component: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: coolcert
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: coolcert
        app.kubernetes.io/component: api
    spec:
      containers:
        - name: coolcert
          image: coolcert:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: coolcert-config
            - secretRef:
                name: coolcert-secrets
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
