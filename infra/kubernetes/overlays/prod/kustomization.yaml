apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: coolcert-prod

resources:
  - namespace.yaml
  - ../../base

images:
  - name: coolcert
    newName: registry.cars-operator-system.svc.cluster.local:5000/p2ppsr/coolcert
    newTag: local

patches:
  - target:
      kind: Certificate
      name: coolcert-tls
    patch: |-
      - op: replace
        path: /spec/dnsNames
        value:
          - coolcert-api.babbage.systems
